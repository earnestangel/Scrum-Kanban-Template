# Tests for the template itself. Not installed into projects (see package.json "files").
name: Template tests

on:
  pull_request:
  push:
    branches: [master, main, develop]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
      - run: node scripts/kanban/render-board.mjs --check
